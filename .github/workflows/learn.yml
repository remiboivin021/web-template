name: learn-from-pr
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to extract context from
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: learn-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - id: extract
        uses: remiboivin021/agent-learning-pooc@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ inputs.pr_number }}
      - if: steps.extract.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-context-${{ github.event.pull_request.number || inputs.pr_number }}
          path: context.json
          retention-days: 14
